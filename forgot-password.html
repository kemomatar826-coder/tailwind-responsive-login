<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./output.css">
    <link rel="stylesheet" href="./node_modules/@fortawesome/fontawesome-free/css/all.min.css">

    <title>Forgot Password</title>
</head>

<body class="min-h-screen bg-amber-200/50 flex justify-center items-center p-4">

    <div class="w-full max-w-[400px] bg-[#f8ead9] rounded-2xl shadow-xl shadow-yellow-200 p-8">

        <!-- Title -->
        <div class="text-center mb-6">

            <div class="text-amber-800 text-4xl mb-3">
                <i class="fas fa-lock"></i>
            </div>

            <h1 class="text-3xl font-extrabold text-amber-800">
                Forgot Password?
            </h1>

            <p class="text-[13px] text-gray-600 mt-2">
                Enter your email to reset your password
            </p>

        </div>


        <form>

            <!-- Email -->
            <div class="flex items-center mb-5 border-b-2 border-[#4b220f]">

                <i class="fas fa-envelope text-lg text-[#4b220f]"></i>

                <input
                    type="email"
                    placeholder="Email Address.."
                    class="p-2 outline-none w-full bg-transparent"
                    required
                >

            </div>


            <!-- Reset Button -->
            <button
                type="submit"
                class="w-full mb-5 bg-[#6b3015] py-2 text-white rounded-full hover:bg-[#a44c23] cursor-pointer duration-200"
            >
                Reset Password
            </button>


            <!-- Back -->
            <p class="text-center text-gray-500 text-[14px]">

                Remember your password?

                <a
                    href="index.html"
                    class="font-black hover:text-[#a44c23] duration-200"
                >
                    Sign In
                </a>

            </p>

        </form>

    </div>

</body>

</html>
